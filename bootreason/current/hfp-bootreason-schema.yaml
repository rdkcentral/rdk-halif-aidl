# Pykwalify schema for bootreason/current/hfp-bootreason.yaml.
#
# Generated by scripts/hfp_schema.py from bootreason/current/hfp-bootreason.yaml and the AIDL enums of
# the module. Do not edit: change the HFP or the AIDL, then run
#   scripts/validate_hfp.sh --generate

type: map
mapping:
  bootreason:
    type: map
    required: true
    mapping:
      interfaceVersion:
        type: str
        required: true
      supportedBootCauses:
        type: seq
        required: true
        sequence:
        - type: str
          desc: AIDL enum com.rdk.hal.bootreason.BootCause
          enum:
          - ERROR_UNKNOWN
          - WATCHDOG
          - MAINTENANCE_REBOOT
          - THERMAL_RESET
          - WARM_RESET
          - COLD_BOOT
          - STR_AUTH_FAILURE
      supportedResetTypes:
        type: seq
        required: true
        sequence:
        - type: str
          desc: AIDL enum com.rdk.hal.bootreason.ResetType
          enum:
          - FULL_SYSTEM_RESET
          - INVALIDATE_CURRENT_APPLICATION_IMAGE
          - FORCE_DISASTER_RECOVERY
          - MAINTENANCE_REBOOT
          - SOFTWARE_REBOOT
      supportedPowerSources:
        type: seq
        required: true
        sequence:
        - type: str
          desc: AIDL enum com.rdk.hal.bootreason.PowerSource
          enum:
          - UNKNOWN
          - PSU
          - USB
          - POE
