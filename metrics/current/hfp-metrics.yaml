# HAL Feature Profile for com.rdk.hal.metrics.
#
# THIS FILE IS THE CONTRACT. It states the interface data a vendor must
# implement and return, and it is what the test suites validate a device
# against. A field is defined here and nowhere else: its meaning and this
# product's declaration of it are the same statement, so there is no separate
# dictionary to agree with.
#
# AFTER EDITING, RUN:  scripts/generate.py
# It computes each field's id, writes it back in, regenerates the reference doc
# and the per-field requirements, and fails if anything is inconsistent. No
# arguments; there is no mode to pick wrongly.
#
# ---------------------------------------------------------------------------
# NAMING
#
#   Every metric name is four segments, fully qualified, no short form:
#
#       <domain>.<element>.<instance>.<field>    av.video_decoder.0.frames_decoded
#
#   The first three address a source; the fourth selects a field within it.
#   THIS FILE DECLARES THE ELEMENT, NOT THE INSTANCE. It states that a
#   video_decoder reports frames_decoded, once, plus `instances: 2` - it never
#   enumerates .0 and .1. The live set is discovered at runtime through
#   getSourcePaths(), because it is dynamic: a picture-in-picture decoder
#   exists only while the second session does.
#
# ---------------------------------------------------------------------------
# ONE PROFILE PER LAYER
#
#   This profile is the HAL layer's - what a SoC vendor owes. A layer above the
#   HAL keeps its own profile in its own repository: the middleware that owns
#   the session state machine declares its figures there, not here, and a
#   vendor is never asked to serve them. getCapabilities() returns the union of
#   every profile live on the device, which composes without translation only
#   because each follows the same shape.
#
#   A layer never declares another layer's fields. That is what keeps "who owes
#   this figure" answerable from the file it appears in.
#
# ---------------------------------------------------------------------------
# RULES THAT BITE
#
#   * A name absent from this file is ABSENT at runtime - never served as 0.
#     "This SoC cannot measure it" and "it measured zero" must stay distinct.
#   * DECLARE THE WHOLE SET, COMMENT OUT WHAT YOU CANNOT SERVE, with a reason
#     on the same line. The file then reads as a checklist: a reviewer sees
#     what this SoC does not do, rather than having to notice something
#     missing.
#   * AN ID IS THE FIELD'S CONTRACT, NOT ITS INDEX. It is the first 8 bytes of
#     SHA-256 over "<domain>.<element>.<field>|<unit>|<kind>", so nothing
#     allocates it and there is no registry to consult. A consumer compares it
#     against the id it was built with: a product serving a name in the wrong
#     unit, or with the wrong kind, is a hard mismatch rather than a silently
#     wrong number. It is generated - delete it and the generator restores it,
#     so a rename or a unit change flows through.
#   * `provider` records who is expected to source the figure. It is a
#     per-product outcome, not a fixed property: where a driver serves a field
#     its value is used, and a consumer cannot tell which and does not need to.
#   * `description` is what a vendor implements against and what a test
#     asserts. A field without one cannot be implemented, and the generator
#     rejects it.
#   * captureCadenceMs may be TIGHTER than the 50 ms floor, never looser.
#   * `instances` is the count the hardware SUPPORTS, not the count that is
#     live. It makes capability checkable before boot, lets a test assert that
#     no source index >= instances ever appears, and MUST agree with the owning
#     HAL's own feature profile - a CI-catchable cross-check.
#
# Every value is int64 (AIDL long, signed 64-bit).

metrics:
  interfaceVersion: "0.1.0.0"
  schemaVersion: "0.1.0"

  domains:
    - domain: av
      dictionaryVersion: "1.2"

      elements:

        - element: video_decoder
          instances: 2
          captureCadenceMs: 20
          fields:

            - name: frames_decoded
              unit: frames
              kind: counter
              id: '0x63c81c7efbe7e743'
              provider: Driver
              description: >
                Compressed frames the decoder has decoded and emitted at its output
                (post-decode, pre-sink). +1 per emitted frame. Counted from instance creation;
                never reset on flush/seek.

            - name: frames_dropped
              unit: frames
              kind: counter
              id: '0x2c67d98cc76e6fb7'
              provider: Driver
              description: >
                Frames the decoder discarded **before output** — undecodable (corruption /
                unsupported) or shed under decode overload. **Excludes** presentation-side
                drops, which are `av.video_sink`'s. A frame here is not also in
                `frames_decoded`.

            - name: decode_errors
              unit: events
              kind: counter
              id: '0x070bb5fa11ef497b'
              provider: Driver
              description: >
                Decode-error occurrences (bitstream/NAL parse failure, codec fault).
                Decoder-internal. A **distinct axis** from `frames_dropped`: an error need not
                drop a frame, and a drop need not be an error.

            - name: decode_latency_sum_us
              unit: us
              kind: counter
              id: '0x4e69bac967d540b7'
              provider: Driver
              description: >
                Running sum of per-frame decode latency = *(decoder emits frame at output)* −
                *(compressed access unit queued to decoder input)*. Needs the decoder's internal
                input/output timestamps. Mean = `decode_latency_sum_us / frames_decoded`.

            - name: last_decode_error_pts_ms
              unit: ms
              kind: current
              id: '0x14debdd0bbd63a14'
              provider: Driver
              description: >
                Stream PTS at detection of the **most recent** decode error, within ±1 frame
                interval. Read with `decode_errors`: the counter says how many, this says where
                the newest one was. Left undeclared where the SoC cannot derive a PTS — never
                served as `-1`.

            - name: last_decode_error_reason
              unit: none
              kind: current
              id: '0x4fda2a3cf3d7dc09'
              provider: Driver
              description: >
                Closed-vocabulary classification of the most recent decode error. This is the
                value a consumer branches on, and it is what makes the fault comparable across
                SoCs.

            - name: last_decode_error_vendor_code
              unit: none
              kind: current
              id: '0x26d18e085c02dfd4'
              provider: Driver
              description: >
                The SoC's own error code for the same fault, carried through uninterpreted. For
                vendor diagnosis; never branched on.


          events:

            - kind: decode_error
              description: >
                Raised at detection of a decode fault, once per fault. A fault that
                also discards a frame raises this and advances `frames_dropped`; a
                fault that does not raises this alone. The two are separate axes.
              fields:

                - name: reason
                  unit: none
                  description: >
                    Closed vocabulary: bitstream_error | unsupported_format |
                    decoder_fault | resource_lost | hardware_fault. The value a
                    consumer branches on, and what makes the fault comparable across
                    SoCs.

                - name: vendor_code
                  unit: none
                  description: >
                    The SoC's own error code for the same fault, carried through
                    uninterpreted. For vendor diagnosis; never branched on.

                - name: pts_ms
                  unit: ms
                  description: >
                    Stream PTS at detection, within ±1 frame interval. Omitted where
                    the SoC cannot derive a PTS — never sent as `-1`.

        - element: video_sink
          instances: 2
          fields:

            - name: frames_received
              unit: frames
              kind: counter
              id: '0x524c81ef37d81082'
              provider: Driver
              description: >
                Decoded frames received to be presented from the decoder.

            - name: frames_presented
              unit: frames
              kind: counter
              id: '0x7f36b75533d5db3a'
              provider: Driver
              description: >
                Frames handed to display scanout for presentation — one per successful render.

            - name: frames_dropped_late
              unit: frames
              kind: counter
              id: '0x7682bfb371ecc4d5'
              provider: Driver
              description: >
                Frames dropped because their PTS deadline (vs the render clock) had passed by
                **> one display frame-interval** at the sink render check — too late to show.
                Sink render-decision internal.

            - name: frames_dropped_frc
              unit: frames
              kind: counter
              id: '0x6c43fb5584823d18'
              provider: Driver
              description: >
                Frames dropped by **frame-rate conversion** when source rate > display rate
                (cadence decimation) — *not* because they were late. FRC-internal.

            - name: frames_repeated_frc
              unit: frames
              kind: counter
              id: '0x72b9db4bfce6f2ab'
              provider: Driver
              description: >
                Frames repeated (held > 1 display interval) by **FRC** when source rate <
                display rate (cadence up-conversion). Normal content cadence — **not** a freeze.
                FRC-internal.

            - name: frames_repeated_missing_frame
              unit: frames
              kind: counter
              id: '0x5a652c2dcf72deac'
              provider: Driver
              description: >
                Frames repeated **to cover a missing next frame** — the sink had no new decoded
                frame ready at render time (starvation cover). Feeds `freeze_duration_ms`.
                Sink-internal.

            - name: underflowed
              unit: episodes
              kind: counter
              id: '0x6804c05ae6533181'
              provider: Driver
              description: >
                Count of video buffer-underflow **episodes**. +1 at each episode **start** (no
                frame to present at render time); ends when a new frame is presented.

            - name: underflow_duration_ms
              unit: ms
              kind: counter
              id: '0x23e55a88f5bbbd94'
              provider: Driver
              description: >
                Cumulative wall-clock time across all video-underflow episodes (Σ of each
                episode's start→clear). Paired with `underflowed`. An underflow episode
                manifests on screen as a freeze.

            - name: freeze_duration_ms
              unit: ms
              kind: counter
              id: '0x1c86c5dfa4db5108'
              provider: Driver
              derivedFrom: av.video_sink.frames_repeated_missing_frame
              description: >
                Cumulative on-screen time the same frame was held due to
                **repeated-to-cover-missing-frame** (customer-visible freeze) — the time
                integral of `frames_repeated_missing_frame`. Excludes FRC cadence repeats.
                Derived from a Driver figure.

            - name: freeze_event_count
              unit: events
              kind: counter
              id: '0x5196f6826e91a801'
              provider: Driver
              derivedFrom: av.video_sink.frames_repeated_missing_frame
              description: >
                Count of freeze episodes — +1 per episode start. Paired with
                `freeze_duration_ms`: mean freeze length = `freeze_duration_ms` /
                `freeze_event_count`.

            - name: max_freeze_duration_ms
              unit: ms
              kind: high_water
              id: '0x088d619c00c1c539'
              provider: Driver
              derivedFrom: av.video_sink.frames_repeated_missing_frame
              description: >
                Longest single freeze episode observed since instance creation. Monotone
                non-decreasing high-water mark.

            - name: render_latency_sum_us
              unit: us
              kind: counter
              id: '0x75f862796424b00d'
              provider: Driver
              description: >
                Running sum of per-frame render latency = *(frame presented to scanout)* −
                *(frame received at sink input)*. Needs the sink's internal present timestamp.
                Paired with `frames_presented`.

            - name: buffer_depth_ms
              unit: ms
              kind: current
              id: '0x111d82c20cb9e693'
              provider: Driver
              description: >
                Buffered decoded media ahead of the present position **now** — Σ
                presentation-durations of frames queued but not yet presented. Live sample
                re-read each capture; **not** cumulative. **Warning:** SoC- and use-case-specific.

            - name: last_underflow_trigger
              unit: none
              kind: current
              id: '0x03210d8159685756'
              provider: Driver
              description: >
                Closed-vocabulary cause of the most recent underflow episode: startup prefill,
                mid-stream, seek recovery, trickplay recovery, content boundary. Distinguishes
                an expected starvation from a defect.

            - name: last_underflow_duration_ms
              unit: ms
              kind: current
              id: '0x7b1ed4a908e8ef1b'
              provider: Driver
              description: >
                Length of the most recent **completed** underflow episode. Read with
                `underflowed` and `underflow_duration_ms`, which give the count and the total.

            - name: last_dropped_frame_pts_ms
              unit: ms
              kind: current
              id: '0x0e6d081eed2918dd'
              provider: Driver
              description: >
                Stream PTS of the most recently dropped frame, within ±1 frame interval,
                whatever the drop axis. Turns a drop count into a locatable defect. Left
                undeclared where no PTS is derivable.

            - name: last_freeze_pts_ms
              unit: ms
              kind: current
              id: '0x42cfffc003874fd4'
              provider: Driver
              description: >
                Stream PTS at which the most recent freeze episode began, within ±1 frame
                interval. Does the same for a freeze as `last_dropped_frame_pts_ms` does for
                a drop — turns a count into a locatable defect. Left undeclared where no PTS
                is derivable.

            - name: last_freeze_duration_ms
              unit: ms
              kind: current
              id: '0x3e53a4af6a16f1ce'
              provider: Driver
              derivedFrom: av.video_sink.frames_repeated_missing_frame
              description: >
                Length of the most recent **completed** freeze episode. Read with
                `freeze_event_count` and `freeze_duration_ms`, which give the count and the
                total, and with `max_freeze_duration_ms`, which gives the worst.

            - name: first_frame_presented_pts_ms
              unit: ms
              kind: current
              id: '0x56eaeb10709bcdd8'
              provider: Driver
              description: >
                PTS of the first frame to reach presentation — set at session start and re-set
                after each seek or flush. This is the hardware's contribution to
                time-to-first-frame; whatever elapsed above the HAL before decode began is
                observed by the party that started the session.


          events:

            - kind: underflow
              description: >
                Raised at the START of a starvation episode — the instant there is
                nothing to present at render time. Exactly one `underflow_end` closes
                it.
              fields:

                - name: trigger
                  unit: none
                  description: >
                    Closed vocabulary: startup_prefill | mid_stream | seek_recovery |
                    trickplay_recovery | content_boundary. Distinguishes an expected
                    starvation from a defect.

            - kind: underflow_end
              description: >
                Raised when presentation resumes, closing the episode the preceding
                `underflow` opened.
              fields:

                - name: duration_ms
                  unit: ms
                  description: >
                    Length of the episode this closes, start to resume. Not
                    cumulative — `underflow_duration_ms` carries the running total.

            - kind: first_frame_presented
              description: >
                Raised when the first frame reaches presentation — once at session
                start, and again after each seek or flush.
              fields:

                - name: pts_ms
                  unit: ms
                  description: >
                    PTS of the frame that reached presentation. Omitted where the SoC
                    cannot derive a PTS.

            - kind: quality_threshold_crossed
              description: >
                Raised when a quality counter crosses its declared threshold. Only the
                sink knows whether it shed a frame or repeated one, so which counter
                moved is carried rather than inferred.
              fields:

                - name: metric
                  unit: none
                  description: >
                    Which counter crossed: frames_dropped | frames_repeated.

                - name: count
                  unit: frames
                  description: >
                    How many frames the crossing covered.

                - name: pts_ms
                  unit: ms
                  description: >
                    Stream PTS at the crossing. Omitted where no PTS is derivable.

        - element: audio_decoder
          instances: 2
          fields:

            - name: frames_decoded
              unit: frames
              kind: counter
              id: '0x23c94a86f7865005'
              provider: Driver
              description: >
                Audio access units decoded and emitted at the decoder output. +1 per emitted
                access unit. Counted from instance creation; never reset on flush/seek.

            - name: frames_dropped
              unit: frames
              kind: counter
              id: '0x748c7fd20b15139d'
              provider: Driver
              description: >
                Audio frames discarded before output (xruns / undecodable). Decoder-internal.
                Excludes `frames_decoded`.

            - name: decode_errors
              unit: events
              kind: counter
              id: '0x577de621243f5a94'
              provider: Driver
              description: >
                Audio decode-error occurrences — a **distinct axis** from `frames_dropped`,
                exactly as on `av.video_decoder`: an error need not drop a frame, and a drop
                need not be an error. Decoder-internal.

            - name: decode_latency_sum_us
              unit: us
              kind: counter
              id: '0x1b3e9a9b42d47872'
              provider: Driver
              description: >
                Σ per-frame audio decode latency *(output-emitted − input-queued)*. Needs
                decoder-internal timestamps. Paired with `frames_decoded`.

            - name: last_decode_error_pts_ms
              unit: ms
              kind: current
              id: '0x5d4a1b8bfa10cbbe'
              provider: Driver
              description: >
                Stream PTS at detection of the most recent audio decode error, within ±1 frame
                interval. Read with `decode_errors`. Left undeclared where no PTS is derivable —
                never served as `-1`.

            - name: last_decode_error_reason
              unit: none
              kind: current
              id: '0x10596fb80be50427'
              provider: Driver
              description: >
                Closed-vocabulary classification of the most recent audio decode error. The
                value a consumer branches on.

            - name: last_decode_error_vendor_code
              unit: none
              kind: current
              id: '0x7129e447242c26d5'
              provider: Driver
              description: >
                The SoC's own code for the same fault, carried through uninterpreted. For vendor
                diagnosis; never branched on.


          events:

            - kind: decode_error
              description: >
                Raised at detection of a decode fault, once per fault. A fault that
                also discards a frame raises this and advances `frames_dropped`; a
                fault that does not raises this alone. The two are separate axes.
              fields:

                - name: reason
                  unit: none
                  description: >
                    Closed vocabulary: bitstream_error | unsupported_format |
                    decoder_fault | resource_lost | hardware_fault. The value a
                    consumer branches on, and what makes the fault comparable across
                    SoCs.

                - name: vendor_code
                  unit: none
                  description: >
                    The SoC's own error code for the same fault, carried through
                    uninterpreted. For vendor diagnosis; never branched on.

                - name: pts_ms
                  unit: ms
                  description: >
                    Stream PTS at detection, within ±1 frame interval. Omitted where
                    the SoC cannot derive a PTS — never sent as `-1`.

        - element: audio_sink
          instances: 1
          fields:

            - name: underflowed
              unit: episodes
              kind: counter
              id: '0x142f899619c8c4a9'
              provider: Driver
              description: >
                Count of audio buffer-underflow **episodes**. +1 at each episode start (no
                decoded audio to present); ends when output resumes. Counterpart of
                `av.video_sink.underflowed` — without it an audio underflow rate cannot be
                computed at all.

            - name: underflow_duration_ms
              unit: ms
              kind: counter
              id: '0x4ce68288bc2f93b2'
              provider: Driver
              description: >
                Cumulative time the audio path was starved of decoded data (Σ of each episode
                start→clear). Paired with `underflowed`: mean episode length =
                `underflow_duration_ms` / `underflowed`.

            - name: silence_duration_ms
              unit: ms
              kind: counter
              id: '0x09fdcdf6715ef048'
              provider: Driver
              description: >
                Cumulative emitted **digital silence** in periods that reached
                `silence_threshold_ms`. Digital-silence detection is in the audio
                path. Distinguishes unexpected absence of audio output from starvation
                (`underflow_duration_ms`).

            - name: silence_event_count
              unit: events
              kind: counter
              id: '0x357a57be2601412e'
              provider: Driver
              description: >
                Count of completed digital-silence periods that reached
                `silence_threshold_ms`. Paired with `silence_duration_ms`: mean silence length =
                `silence_duration_ms` / `silence_event_count`.

            - name: buffer_depth_ms
              unit: ms
              kind: current
              id: '0x1aea4fc8a27262b7'
              provider: Driver
              description: >
                Buffered decoded audio ahead of the play position **now**. Live sample re-read
                each capture; **not** cumulative. **Warning:** SoC- and use-case-specific.

            - name: last_underflow_trigger
              unit: none
              kind: current
              id: '0x40771a4a2b2ee087'
              provider: Driver
              description: >
                Closed-vocabulary cause of the most recent audio underflow episode, same
                vocabulary as `av.video_sink.last_underflow_trigger`.

            - name: last_underflow_duration_ms
              unit: ms
              kind: current
              id: '0x638f410fc657c525'
              provider: Driver
              description: >
                Length of the most recent **completed** audio underflow episode. Read with
                `underflowed` and `underflow_duration_ms`, which give the count and the total.

            - name: last_silence_duration_ms
              unit: ms
              kind: current
              id: '0x1cf88c9352312e83'
              provider: Driver
              description: >
                Length of the most recent completed digital-silence period. Read with
                `silence_event_count` and `silence_duration_ms`.

            - name: silence_threshold_ms
              unit: ms
              kind: config
              id: '0x02c4359649749c70'
              writable: true
              provider: Driver
              description: >
                Shortest digital-silence period that counts as one. Silence is normal
                output — a gap between programmes, a muted stream, a silent passage —
                so this is the line between that and a fault worth reporting. Default
                500 ms. Writable so an integrator can tighten it per product.


          events:

            - kind: underflow
              description: >
                Raised at the START of a starvation episode — the instant there is
                nothing to present at render time. Exactly one `underflow_end` closes
                it.
              fields:

                - name: trigger
                  unit: none
                  description: >
                    Closed vocabulary: startup_prefill | mid_stream | seek_recovery |
                    trickplay_recovery | content_boundary. Distinguishes an expected
                    starvation from a defect.

            - kind: underflow_end
              description: >
                Raised when presentation resumes, closing the episode the preceding
                `underflow` opened.
              fields:

                - name: duration_ms
                  unit: ms
                  description: >
                    Length of the episode this closes, start to resume. Not
                    cumulative — `underflow_duration_ms` carries the running total.

            - kind: silence
              description: >
                Raised when digital silence has continued for `silence_threshold_ms`,
                NOT when it began. Silence is ordinary output, so the threshold is what
                separates a gap between programmes from a fault; below it nothing is
                raised. Raising at the crossing rather than at the close is what makes
                a silence that is still going reportable while it is still going.
              fields:

                - name: elapsed_ms
                  unit: ms
                  description: >
                    Silence already elapsed at the crossing — `silence_threshold_ms`,
                    within one detection interval. Present so a consumer need not
                    assume the threshold it was configured with is the one in force.

            - kind: silence_end
              description: >
                Raised when audio resumes, closing the period the preceding `silence`
                opened. A period that never crossed the threshold raises neither.
              fields:

                - name: duration_ms
                  unit: ms
                  description: >
                    Length of the whole period this closes, from the onset of silence
                    rather than from the crossing. Not cumulative —
                    `silence_duration_ms` carries the running total.

        - element: clock
          instances: 1
          captureCadenceMs: 50
          fields:

            - name: sync_offset_ms
              unit: ms
              kind: current
              id: '0x0853e5868c5f2bd8'
              provider: Driver
              description: >
                The driver's predicted current audio-vs-video presentation offset. **Sign:**
                audio leads → **positive**, video leads → **negative**. Live sample, not
                cumulative.

            - name: sync_max_abs_offset_ms
              unit: ms
              kind: high_water
              id: '0x20d08f573aeb1229'
              provider: Driver
              derivedFrom: av.clock.sync_offset_ms
              description: >
                Largest `abs(sync_offset_ms)` observed since instance creation. Monotone
                non-decreasing high-water mark — derived from `sync_offset_ms`.

            - name: sync_time_over_threshold_ms
              unit: ms
              kind: counter
              id: '0x323c3766c9e3638c'
              provider: Driver
              derivedFrom: av.clock.sync_threshold_ms
              description: >
                Cumulative time `abs(sync_offset_ms)` exceeded `sync_threshold_ms` — the time
                integral of out-of-sync operation. Derived from `sync_offset_ms` and
                `sync_threshold_ms`.

            - name: sync_threshold_ms
              unit: ms
              kind: config
              id: '0x4c981a6fd5bbf977'
              writable: true
              provider: Driver
              description: >
                The offset magnitude beyond which playback counts as out of sync. The threshold
                `sync_time_over_threshold_ms` integrates against and `sync_max_abs_offset_ms` is
                judged by — declaring those two without this leaves both uninterpretable.
                Writable so an integrator can tighten it per product.

            - name: resync_count
              unit: events
              kind: counter
              id: '0x1e11b09c212e1a59'
              provider: Driver
              description: >
                Count of A/V-sync **corrections** the clock applied — each discrete realignment
                to re-align audio and video. +1 per applied correction.

            - name: resync_magnitude_sum_ms
              unit: ms
              kind: counter
              id: '0x7be51ba179aa2379'
              provider: Driver
              description: >
                Σ of the **absolute magnitude** (ms) of each resync correction. Clock-internal.
                Paired with `resync_count`: mean correction size = `resync_magnitude_sum_ms /
                resync_count`.

        # Sources    av.drm.0, av.drm.1
        # The decrypt path, one instance per concurrent media session. Only what
        # the driver can observe: work done on keys the session already holds.
        - element: drm
          instances: 2
          captureCadenceMs: 50
          fields:

            - name: decrypt_count
              unit: operations
              kind: counter
              id: '0x01c6bee68b39b413'
              provider: Driver
              description: >
                Decrypt operations completed, summed across the key sessions this media
                session holds. The denominator for mean decrypt latency.

            - name: decrypt_errors
              unit: events
              kind: counter
              id: '0x5db0ea33fec21035'
              provider: Driver
              description: >
                Decrypt operations that failed on a key already held. Distinct from a
                licence that was never obtained, which is not vendor-observable.

            - name: decrypt_latency_sum_us
              unit: us
              kind: counter
              id: '0x6663f481e5048044'
              provider: Driver
              derivedFrom: av.drm.decrypt_count
              description: >
                Σ of decrypt operation latency. Paired with `decrypt_count`: mean decrypt
                latency = `decrypt_latency_sum_us` / `decrypt_count`.
