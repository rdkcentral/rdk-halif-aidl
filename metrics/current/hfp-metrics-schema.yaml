# Pykwalify schema for metrics declarations.
#
# ONE schema, validating EVERY metrics profile: this one, which is the HAL
# layer's, and the profile any layer above the HAL keeps in its own repository.
# getCapabilities() returns their union, which composes without translation only
# because every profile has the same shape.
#
# A profile is the contract - the interface data a vendor must implement and
# return, and what the test suites validate a device against. A field is defined
# in the profile that declares it and nowhere else.
#
# Schema Version: 0.1.0

type: map
mapping:
  metrics:
    type: map
    required: true
    mapping:

      interfaceVersion:
        type: str
        required: true

      schemaVersion:
        type: str
        required: true
        pattern: '^\d+\.\d+\.\d+$'

      domains:
        type: seq
        required: true
        sequence:
          - type: map
            mapping:

              # Subject area. The unit of extension: a new domain touches
              # nothing that exists. Compound names use "_" (e.g. cmcd_v2), so
              # every "." in a metric path stays a real level.
              domain:
                type: str
                required: true
                pattern: '^[a-z][a-z0-9_]*$'

              # Revision of THIS domain's dictionary. Per domain, because an
              # A/V dictionary cannot define cpu.core.utilisation_pct.
              dictionaryVersion:
                type: str
                required: true

              # true  = computed from measured fields; platform-declared only.
              # false = measured by an instrument. Default false.
              derived:
                type: bool
                required: false

              elements:
                type: seq
                required: true
                sequence:
                  - type: map
                    mapping:

                      # The thing within the domain that produces figures.
                      # Declared ONCE per element type — instances are not
                      # declared, they are discovered at runtime, because they
                      # are dynamic (a PiP decoder exists only while the
                      # second session does).
                      element:
                        type: str
                        required: true
                        pattern: '^[a-z][a-z0-9_]*$'

                      # How many of this element the hardware SUPPORTS — not
                      # how many are live. The live set is discovered at
                      # runtime; this is the ceiling, so dual-decode capability
                      # is checkable before boot and a test can assert that no
                      # source index >= instances ever appears. MUST agree with
                      # the owning HAL's own HFP.
                      instances:
                        type: int
                        required: true
                        range: { min: 1 }

                      # Cadence this element is polled at. May be TIGHTER than
                      # the 50 ms platform floor; never looser — the freshness
                      # contract is a partner-facing promise. Default 50.
                      pollCadenceMs:
                        type: int
                        required: false
                        range: { min: 1, max: 50 }

                      fields:
                        type: seq
                        required: true
                        sequence:
                          - type: map
                            mapping:

                              # Field name, unique within its element. Must be
                              # defined in this domain's dictionary at the
                              # declared dictionaryVersion — CI-validated.
                              name:
                                type: str
                                required: true
                                pattern: '^[a-z][a-z0-9_]*$'

                              unit:
                                type: str
                                required: true
                                enum: [frames, episodes, ms, us, ns, bytes, events, percent, hz, none]

                              # How the value behaves over time — governs what
                              # arithmetic a consumer may do:
                              #   counter    cumulative; may be differenced
                              #   current    live sample; NEVER sum it
                              #   high_water monotone max
                              #   config     a tunable's present value
                              kind:
                                type: str
                                required: true
                                enum: [counter, current, high_water, config]

                              # setField() accepted. Default false.
                              writable:
                                type: bool
                                required: false

                              # Who is expected to source this figure. A
                              # per-product outcome, not a fixed property of
                              # the field: a consumer cannot tell which and
                              # does not need to.
                              provider:
                                type: str
                                required: true

                              # What a vendor implements against and what a
                              # test asserts. A field without one cannot be
                              # implemented.
                              description:
                                type: str
                                required: true

                              # The measured field this one is computed from,
                              # named <domain>.<element>.<field>. Declaring a
                              # derived field without its input is an
                              # undeliverable declaration, not a partial
                              # capability.
                              derivedFrom:
                                type: str
                                required: false

                              # Content-derived field identity, written by
                              # scripts/generate.py:
                              #   first 8 bytes of SHA-256 over
                              #   "<domain>.<element>.<field>|<unit>|<kind>"
                              # A client compares it against the id it was built
                              # with, so a field whose unit or kind changed is a
                              # hard mismatch rather than a silently wrong number.
                              # Nothing allocates it - delete it and the
                              # generator restores it, so a rename flows through.
                              id:
                                type: str
                                required: false
                                pattern: '^0x[0-9a-f]{16}$'

                              # DERIVED domains only: the measured fields this is
                              # computed from, named the way every declaration
                              # names a field — <domain>.<element>.<field>, no
                              # instance. The instance matches positionally at
                              # runtime (cmcd_v2.video.N derives from
                              # av.video_sink.N), and the runtime name is fully
                              # qualified like every other.
                              # Recorded so a derived value cannot silently
                              # drift from its base, and so a device's coverage
                              # of a standard is computable from its measured
                              # declaration before it ships.
                              from:
                                type: seq
                                required: false
                                sequence:
                                  - type: str
                                    pattern: '^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$'
