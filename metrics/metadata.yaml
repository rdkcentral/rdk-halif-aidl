# component   - Machine-readable component identifier                    [manual]
# version     - Pre-baseline: 0.<generation>.<minor>.<patch>              [release.sh]
# status      - RAG status: GREEN / AMBER / RED                          [manual]
# description - One-line human-readable summary                          [manual]
# type        - Responsibility: SOC or OEM                                [manual]
component: metrics
version: 0.1.0.0
status: AMBER
description: "Device metrics — named int64 values and events, organised into domains"
type: SOC

# lifecycle - 14+5 review cycle dates                                    [pr_cycle.sh]
#   review_started    - Date the review window opened
#   review_deadline   - review_started + 14 calendar days
#   target_green_date - review_deadline + 5 business days
lifecycle:
  review_started: ~
  review_deadline: ~
  target_green_date: ~

# scope - High-level architectural responsibilities                       [manual]
scope:
  - General device metrics transport — named int64 values from whoever measures them to whoever consumes them
  - Domain model, so cpu/memory and future subjects ride the same contract as av without interface change
  - Per-source atomic snapshot reads, so paired counters cannot be read torn
  - Declared metric set (hfp-metrics.yaml), keeping the metric dictionary out of the ABI
  - Per-source event buffer bridging one poll interval, single reader, loss reported not hidden

# notes - Tracking metadata                                              [manual]
notes:
  priority: 2
  status_detail: "New module, first draft for review"
  action: "Vendor / VL / architecture review of the namespace and declaration model"
  owners: "Architecture + AV_Architecture"

# reviewers - Sign-off status per stakeholder team                       [manual]
#   Values: pending | in_review | changes_requested | recheck | reviewed | abstained
reviewers:
    Architecture: pending
    Product_Architecture: pending
    AV_Architecture: pending
    Vendor_Layer_Team: pending
