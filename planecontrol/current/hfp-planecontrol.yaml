# HAL Feature Profile for planecontrol

planecontrol:                   # Component object begins
  interfaceVersion: current
  planes:                   # Resource list
    - 0:                    # Resource object begins
        type: VIDEO
        pixelFormats:
          - NATIVE
        sourceTypes:  # Supported source types for this plane (enum SourceType)
          - VIDEO_SINK
          - HDMI
          - COMPOSITE
        maxWidth: 3840  # Maximum display width this plane supports (in pixels)
        maxHeight: 2160  # Maximum display height this plane supports (in pixels)
        frameWidth: 3840  # Width of the full frame reference coordinate system
        frameHeight: 2160  # Height of the full frame reference coordinate system
        supportedDynamicRanges:  # Dynamic ranges supported by this plane (enum DynamicRange)
          - SDR
          - HLG
          - HDR10
          - HDR10_PLUS
          - DOLBY_VISION
        colorDepth: 12  # Bit depth of supported pixel formats (e.g. 8, 10, 12)
        maxFrameRate: 60  # Maximum supported refresh rate in Hz (e.g. 60fps)
        supportsAlpha: true  # Whether ALPHA property is supported (transparency blending)
        supportsZOrder: true  # Whether ZORDER property is supported (for plane stacking)
        vsyncDisplayLatency: 3  # Display latency in vsync periods
    - 1:                    # Resource object begins
        type: VIDEO
        pixelFormats:
          - NATIVE
        sourceTypes:  # Supported source types for this plane (enum SourceType)
          - VIDEO_SINK
          - HDMI
          - COMPOSITE
        maxWidth: 3840
        maxHeight: 2160
        frameWidth: 3840
        frameHeight: 2160
        supportedDynamicRanges:
          - SDR
        colorDepth: 10
        maxFrameRate: 60
        supportsAlpha: true
        supportsZOrder: true
        vsyncDisplayLatency: 3
    - 2:                    # Resource object begins
        type: GRAPHICS
        pixelFormats:
          - RGB
        sourceTypes: []  # Graphics planes do not support video source mapping
        maxWidth: 1920
        maxHeight: 1080
        frameWidth: 1920
        frameHeight: 1080
        supportedDynamicRanges:
          - SDR
        colorDepth: 8
        maxFrameRate: 60
        supportsAlpha: true
        supportsZOrder: false
        vsyncDisplayLatency: 1
        graphicsFbCapabilities:
          maxGraphicsFrameBuffers: 3
          maxGraphicsFbWidth: 1920
          maxGraphicsFbHeight: 1080
          format: 0x34325258
          modifier: 0x0000000000000000
    - 3:                    # Resource object begins
        type: CAPTURE       # Destination is the client's texture, not the display.
                            # Declare one capture plane per concurrent capture
                            # session the product can serve; omit the type
                            # entirely on a product that cannot decode to texture.
        sourceTypes:  # Video source types that may be mapped to this plane
          - VIDEO_SINK
        captureCapabilities:  # Frames and buffer pool for ICapture on this plane.
                              # Required on a plane of type CAPTURE. This is the whole
                              # of the capture declaration - the vendor layer configures
                              # whatever the decoder needs to deliver what is declared
                              # here.
          stallsWhenPoolExhausted: false  # true: decoder stalls when all buffers locked
                                          # false: oldest ready frame is dropped
          # FOURCC codes and modifiers are the kernel's, from include/uapi/drm/drm_fourcc.h.
          # Declared in pairs: a modifier is valid with particular formats.
          supportedFormats:     # The pairs this product can deliver, and the whole of them
            - fourcc: 0x3231564E              # DRM_FORMAT_NV12
              modifier: 0x0000000000000000    # DRM_FORMAT_MOD_LINEAR
          maxFrameWidth: 1920   # Maximum captured frame width (Property.WIDTH)
          maxFrameHeight: 1080  # Maximum captured frame height (Property.HEIGHT)
          supportedCodecs:      # Codecs whose decoded frames this plane can capture.
                                # Declare what this product can do. A decoder opened
                                # for a codec not listed here decodes and displays
                                # normally; it just cannot feed this plane.
            - H264_AVC
            - AV1
          resize: false         # false: captured resolution must equal the decoded
                                # resolution; a mismatch fails start() with
                                # RESOLUTION_MISMATCH and nothing is scaled.
