# Pykwalify schema for planecontrol/current/hfp-planecontrol.yaml.
#
# Generated by scripts/hfp_schema.py from planecontrol/current/hfp-planecontrol.yaml and the AIDL enums of
# the module. Do not edit: change the HFP or the AIDL, then run
#   scripts/validate_hfp.sh --generate

type: map
mapping:
  planecontrol:
    type: map
    required: true
    mapping:
      interfaceVersion:
        type: str
        required: true
      planes:
        type: seq
        required: true
        sequence:
        - type: map
          mapping:
            regex;(^\d+$):
              type: map
              mapping:
                type:
                  type: str
                  required: true
                  desc: AIDL enum com.rdk.hal.planecontrol.PlaneType
                  enum:
                  - VIDEO
                  - GRAPHICS
                pixelFormats:
                  type: seq
                  required: true
                  sequence:
                  - type: str
                sourceTypes:
                  type: seq
                  required: true
                  sequence:
                  - type: str
                    desc: AIDL enum com.rdk.hal.planecontrol.SourceType
                    enum:
                    - NONE
                    - VIDEO_SINK
                    - HDMI
                    - COMPOSITE
                maxWidth:
                  type: int
                  required: true
                maxHeight:
                  type: int
                  required: true
                frameWidth:
                  type: int
                  required: true
                frameHeight:
                  type: int
                  required: true
                supportedDynamicRanges:
                  type: seq
                  required: true
                  sequence:
                  - type: str
                colorDepth:
                  type: int
                  required: true
                maxFrameRate:
                  type: int
                  required: true
                supportsAlpha:
                  type: bool
                  required: true
                supportsZOrder:
                  type: bool
                  required: true
                vsyncDisplayLatency:
                  type: int
                  required: true
                graphicsFbCapabilities:
                  type: map
                  mapping:
                    maxGraphicsFrameBuffers:
                      type: int
                      required: true
                    maxGraphicsFrameBufferWidth:
                      type: int
                      required: true
                    maxGraphicsFrameBufferHeight:
                      type: int
                      required: true
                    format:
                      type: int
                      required: true
                    modifier:
                      type: int
                      required: true
