# Pykwalify schema for audio decoder capabilities
# Enforces codec-specific profile validation
# Schema Version: 0.1.0

type: map
mapping:
  audiodecoder:
    type: map
    required: true
    mapping:
      interfaceVersion:
        type: str
        required: true

      schemaVersion:
        type: str
        required: true
        pattern: '^\d+\.\d+\.\d+$'

      Capabilities:
        type: seq
        required: true
        sequence:
          - type: map
            matching: "any"
            mapping:
              regex;(^\d+$):
                type: map
                mapping:
                  codecCapabilities:
                    type: seq
                    required: true
                    sequence:
                      - type: map
                        mapping:
                          PCM:
                            type: map
                            mapping:
                              profiles:
                                type: seq
                                required: false
                                sequence:
                                  - type: str
                                    enum: []
                              maxBitrateInBps:
                                type: number
                                required: true
                              maxChannels:
                                type: int
                                required: true
                              maxSampleRateInHz:
                                type: int
                                required: true
                              maxBitDepth:
                                type: int
                                required: false

                          AAC:
                            type: map
                            mapping:
                              profiles:
                                type: seq
                                required: false
                                sequence:
                                  - type: str
                                    enum: [LC, HE_V1, HE_V2, ELD, X_HE]
                              maxBitrateInBps:
                                type: number
                                required: false
                              maxChannels:
                                type: int
                                required: false
                              maxSampleRateInHz:
                                type: int
                                required: false
                              maxBitDepth:
                                type: int
                                required: false

                          MPEG_AUDIO:
                            type: map
                            mapping:
                              profiles:
                                type: seq
                                required: false
                                sequence:
                                  - type: str
                                    enum: []
                              maxBitrateInBps:
                                type: number
                                required: true
                              maxChannels:
                                type: int
                                required: true
                              maxSampleRateInHz:
                                type: int
                                required: true
                              maxBitDepth:
                                type: int
                                required: false

                          MP3:
                            type: map
                            mapping:
                              profiles:
                                type: seq
                                required: false
                                sequence:
                                  - type: str
                                    enum: []
                              maxBitrateInBps:
                                type: number
                                required: true
                              maxChannels:
                                type: int
                                required: true
                              maxSampleRateInHz:
                                type: int
                                required: true
                              maxBitDepth:
                                type: int
                                required: false

                          ALAC:
                            type: map
                            mapping:
                              profiles:
                                type: seq
                                required: false
                                sequence:
