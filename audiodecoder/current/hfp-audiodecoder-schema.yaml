# Pykwalify schema for audiodecoder/current/hfp-audiodecoder.yaml.
#
# Generated by scripts/hfp_schema.py from audiodecoder/current/hfp-audiodecoder.yaml and the AIDL enums of
# the module. Do not edit: change the HFP or the AIDL, then run
#   scripts/validate_hfp.sh --generate

type: map
mapping:
  audiodecoder:
    type: map
    required: true
    mapping:
      interfaceVersion:
        type: str
        required: true
      IAudioDecoder:
        type: seq
        required: true
        sequence:
        - type: map
          mapping:
            regex;(^\d+$):
              type: map
              mapping:
                supportedCodecs:
                  type: seq
                  required: true
                  sequence:
                  - type: str
                    desc: AIDL enum com.rdk.hal.audiodecoder.Codec
                    enum:
                    - PCM
                    - AAC_LC
                    - HE_AAC
                    - HE_AAC2
                    - AAC_ELD
                    - DOLBY_AC3
                    - DOLBY_AC3_PLUS
                    - DOLBY_AC3_PLUS_JOC
                    - DOLBY_AC4
                    - DOLBY_MAT
                    - DOLBY_MAT2
                    - DOLBY_TRUEHD
                    - MPEG2
                    - MP3
                    - FLAC
                    - VORBIS
                    - DTS
                    - OPUS
                    - WMA
                    - REALAUDIO
                    - USAC
                    - X_HE_AAC
                    - SBC
                    - AVS
                supportsSecure:
                  type: bool
                  required: true
