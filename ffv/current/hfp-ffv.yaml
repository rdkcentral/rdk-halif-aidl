# HAL Feature Profile (HFP) — Far Field Voice (FFV)
#
# This file describes platform support for the Far Field Voice HAL.
# Every key here mirrors a field name in the AIDL Capabilities parcelable
# (see ffv/current/com/rdk/hal/farfieldvoice/Capabilities.aidl) so a single
# grep finds both the API surface and the per-platform value.
#
# This is a reference HFP — SOC vendors derive platform-specific variants
# from it. Only static capabilities belong here; runtime status
# (current listening mode, privacy flag, hardware-failure flag, etc.)
# is reported through Status / IFarFieldVoiceEventListener at runtime,
# not declared here.

farfieldvoice:
  interfaceVersion: current

  capabilities:                       # Capabilities parcelable
    microphoneChannelCount: 1         # Capabilities.microphoneChannelCount
    channelTypes:                     # Capabilities.channelTypes[]
      - KEYWORD                       # Keyword Audio channel (wake-word-gated)
      - CONTINUAL                     # Continual Audio channel (continuous capture)
      - MICROPHONES                   # Microphones Audio channel (raw per-mic)
    supportedListeningModes:          # Capabilities.supportedListeningModes[]
      - ACTIVE_LISTEN
      - KEYWORD_ALERT
      - POWERED_OFF
