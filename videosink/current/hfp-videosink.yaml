# HAL Feature Profile for videosink

videosink:
  interfaceVersion: current

  # Metrics this product serves through IVideoSink.getMetrics(), for
  # every resource instance, and reported in Capabilities.supportedMetrics.
  # Entries marked mandatory are listed by every product; optional
  # ones only where the product serves them.
  supportedMetrics:
    - FRAMES_RENDERED         # mandatory
    - FRAMES_DROPPED          # mandatory
    - FRAMES_REPEATED         # mandatory
    - FRAME_REPEAT_EPISODES   # mandatory
    - UNDERFLOW_EPISODES      # mandatory
    - UNDERFLOW_DURATION_NS   # mandatory
  # Episodes this product raises through onMetricEpisodeStarted() and
  # onMetricEpisodeResolved(). Names are members of the Episode enum.
  supportedEpisodes:
    - FRAME_DROP              # mandatory
    - FRAME_REPEAT            # mandatory
    - UNDERFLOW               # mandatory

  IVideoSink:
    - id: 0
      supportsAVSync: true
      vsyncDisplayLatencyNs: 2000000
      supportsHoldLastFrame: true
      supportsSecure: true

