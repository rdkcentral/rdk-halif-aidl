aidl_interface:
  name: videosink
  srcs:
    - com/rdk/hal/videosink/*.aidl
  imports:
    - avclock@current
    - common@current
    - metrics@current
    - videodecoder@current
  stability: vintf
  layout: module-local

# The vocabulary scripts/kvcc.py generates this interface's metric enums from.
# A new key there is a new member here, so it is an additive interface change.
kvc:
  vocabulary: videosink
  minimum: "1.0"
