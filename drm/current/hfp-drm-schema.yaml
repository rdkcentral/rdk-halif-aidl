# Pykwalify schema for drm/current/hfp-drm.yaml.
#
# Generated by scripts/hfp_schema.py from drm/current/hfp-drm.yaml and the AIDL enums of
# the module. Do not edit: change the HFP or the AIDL, then run
#   scripts/validate_hfp.sh --generate

type: map
mapping:
  drm:
    type: map
    required: true
    mapping:
      interfaceVersion:
        type: str
        required: true
      serviceName:
        type: str
        required: true
      maxSessions:
        type: int
        required: true
      maxTotalBitrate:
        type: int
        required: true
      supportedSecurityLevels:
        type: seq
        required: true
        sequence:
        - type: str
          desc: AIDL enum com.rdk.hal.drm.SecurityLevel
          enum:
          - UNKNOWN
          - SW_SECURE_CRYPTO
          - SW_SECURE_DECODE
          - HW_SECURE_CRYPTO
          - HW_SECURE_DECODE
          - HW_SECURE_ALL
          - DEFAULT
      supportedHdcpLevels:
        type: seq
        required: true
        sequence:
        - type: str
          desc: AIDL enum com.rdk.hal.drm.HdcpLevel
          enum:
          - HDCP_UNKNOWN
          - HDCP_NONE
          - HDCP_V1
          - HDCP_V2
          - HDCP_V2_1
          - HDCP_V2_2
          - HDCP_NO_OUTPUT
          - HDCP_V2_3
      scheme:
        type: seq
        required: true
        sequence:
        - type: map
          mapping:
            regex;(^[A-Za-z0-9_][A-Za-z0-9_ .+-]*$):
              type: map
              mapping:
                instanceName:
                  type: str
                  required: true
                maxBitrate:
                  type: int
                  required: true
                maxSchemeSessions:
                  type: int
                  required: true
                supportedCipherModes:
                  type: seq
                  required: true
                  sequence:
                  - type: str
                    desc: AIDL enum com.rdk.hal.drm.Mode
                    enum:
                    - UNENCRYPTED
                    - AES_CTR
                    - AES_CBC_CTS
                    - AES_CBC
                supportedKeyTypes:
                  type: seq
                  required: true
                  sequence:
                  - type: str
                    desc: AIDL enum com.rdk.hal.drm.KeyType
                    enum:
                    - OFFLINE
                    - STREAMING
                    - RELEASE
                supportsSecureDecoder:
                  type: bool
                  required: true
                supportedContainerMimeTypes:
                  type: seq
                  required: true
                  sequence:
                  - type: str
