name: "Commit email check"

# Fails when a PR commit is authored or committed with anything other than a
# GitHub noreply address, so every commit is credited to the contributor's
# public GitHub ID (#898).

permissions:
  contents: read

on:
  pull_request:
    branches: [develop, main]

jobs:
  check:
    name: "Commit email check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Check commit author and committer emails"
        run: |
          scripts/check_commit_emails.sh \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
