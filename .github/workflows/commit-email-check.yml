name: "Commit email check"

# Fails when a PR commit is authored or committed with a corporate email
# address, which GitHub credits to an employer-managed account instead of the
# contributor's public ID (#898). The denied domains are listed in
# .github/denied-commit-email-domains.txt.

permissions:
  contents: read

on:
  pull_request:
    branches: [develop, main]

jobs:
  check:
    name: "Commit email check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Check commit author and committer emails"
        run: |
          scripts/check_commit_emails.sh \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
