name: "Release heatmap"

# Regenerates the wiki's Release-Heatmap page when a ticket changes. A board
# edit to Priority or Interface Effect sends no event to a repository workflow
# (`projects_v2_item` is an organisation webhook), so a sweep five minutes
# after each Interface Effect reconcile catches those.

# The job's own GITHUB_TOKEN reads the issues, PRs and the public halif_aidl
# project's items, and pushes the wiki: no repository secret is needed (#986).
permissions:
  contents: write   # the wiki push
  issues: read
  pull-requests: read

on:
  issues:
    types: [opened, edited, deleted, transferred, closed, reopened,
            labeled, unlabeled, milestoned, demilestoned]
  milestone:   # a new or closed milestone adds or drops a column
    types: [created, opened, closed, edited, deleted]
  release:     # a new release resets "resolved since the last release"
    types: [published]
  schedule:
    - cron: "5-59/15 * * * *"
  workflow_dispatch:

# A burst of label edits becomes one run: each new event replaces the one in flight.
concurrency:
  group: release-heatmap
  cancel-in-progress: true

jobs:
  publish:
    name: "Publish the release heatmap"
    runs-on: ubuntu-latest
    # A dispatch can name any branch, and checkout follows it: only the
    # default branch's script gets a token that can write the wiki.
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v4

      - name: "Publish"
        env:
          GH_TOKEN: ${{ github.token }}
          WIKI_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python3 scripts/release_heatmap.py --publish
