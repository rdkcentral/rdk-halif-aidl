name: "Release heatmap"

# Regenerates the wiki's Release-Heatmap page when a ticket changes. A board
# edit to Priority or Interface Effect sends no event to a repository workflow
# (`projects_v2_item` is an organisation webhook), so a sweep five minutes
# after each Interface Effect reconcile catches those.

permissions:
  contents: write   # the wiki push, when no WIKI_TOKEN secret is set

on:
  issues:
    types: [opened, edited, deleted, transferred, closed, reopened,
            labeled, unlabeled, milestoned, demilestoned]
  schedule:
    - cron: "5-59/15 * * * *"
  workflow_dispatch:

# A burst of label edits becomes one run: each new event replaces the one in flight.
concurrency:
  group: release-heatmap
  cancel-in-progress: true

jobs:
  publish:
    name: "Publish the release heatmap"
    runs-on: ubuntu-latest
    # A dispatch can name any branch, and checkout follows it: only the
    # default branch's script gets PROJECTS_TOKEN.
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v4

      - name: "Publish"
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          # A WIKI_TOKEN secret (wiki write) wins; otherwise the job's own token.
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::PROJECTS_TOKEN is not set — heatmap not published"
            exit 0
          fi
          python3 scripts/release_heatmap.py --publish
