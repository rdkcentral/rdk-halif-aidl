  supportedColourTemperatures: # ColourTemperature
    - WARM
    - NORMAL
    - COLD
    - SUPER_COLD
    - CUSTOM
  supportedAVSources: # AVSource, independent of picture mode
    - IP
    - TUNER
    - HDMI_1
    - HDMI_2
    - HDMI_3
    - COMPOSITE_1
  supportedDynamicRanges: # DynamicRange, independent of picture mode
    - SDR
    - HLG
    - HDR10
    - DOLBY_VISION
  # Every PQ parameter that applies across the full picture-mode / dynamic-range /
  # AV-source set references the *pqContexts anchor defined above. A parameter
  # with a narrower support set declares its own pictureModeCapabilities block;
  # DV_CALIBRATION applies to DOLBY_VISION only. The common integer bounds are
  # declared once as &intBounds0to100 and &intBounds0to1 and referenced.
  PQParameterCapabilities:
    - BRIGHTNESS:
        isSupported: true
        isGlobal: false
        rangeBound:
          intBounds: &intBounds0to100
            minValue: 0
            maxValue: 100
        pictureModeCapabilities: *pqContexts
    - CONTRAST:
        isSupported: true
        isGlobal: false
        rangeBound:
          intBounds: *intBounds0to100
        pictureModeCapabilities: *pqContexts
    - SHARPNESS:
        isSupported: true
        isGlobal: false
        rangeBound:
          intBounds: *intBounds0to100
        pictureModeCapabilities: *pqContexts
    - SATURATION:
        isSupported: true
        isGlobal: false
        rangeBound:
          intBounds: *intBounds0to100
        pictureModeCapabilities: *pqContexts
    - HUE:
        isSupported: true
        isGlobal: false
        rangeBound:
          intBounds: *intBounds0to100
        pictureModeCapabilities: *pqContexts
    - MANUAL_BACKLIGHT:
        isSupported: true
        isGlobal: true
        rangeBound:
          intBounds: *intBounds0to100
        pictureModeCapabilities: *pqContexts
    - SDR_GAMMA:
        isSupported: true
        isGlobal: false
        rangeBound:
          intBounds: *intBounds0to100
        pictureModeCapabilities: *pqContexts
    - COLOR_TEMPERATURE:
        isSupported: true
        isGlobal: false
        rangeBound:
          colourTemperatureBounds: # ColourTemperature enum bounds
            minValue: WARM
            maxValue: CUSTOM
        supportedValues:
          colourTemperatureValues:
            - WARM
            - NORMAL
            - COLD
            - SUPER_COLD
            - CUSTOM
        pictureModeCapabilities: *pqContexts
    - DIMMING_MODE:
        isSupported: true
        isGlobal: true
        rangeBound:
          intBounds:
            minValue: 0
            maxValue: 2
        pictureModeCapabilities: *pqContexts
    - DIMMING_LEVEL:
        isSupported: true
        isGlobal: false
        rangeBound:
          intBounds:
            minValue: 0
            maxValue: 3
        pictureModeCapabilities: *pqContexts
    - LOW_LATENCY_STATE:
        isSupported: true
        isGlobal: true
        rangeBound:
          intBounds: &intBounds0to1
            minValue: 0
            maxValue: 1
        pictureModeCapabilities: *pqContexts
    - SATURATION_RED:
