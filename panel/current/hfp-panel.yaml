        pictureModeCapabilities: *pqContexts
    - DV_CALIBRATION:
        isSupported: true
        isGlobal: false
        rangeBound:
          dvCalibrationBounds: # DolbyVisionCalibrationSettings bounds
            minBound:
              Tmax: 0.0
              Tmin: 0.0
              Tgamma: 1.8
              Rx: 0.0
              Ry: 0.0
              Gx: 0.0
              Gy: 0.0
              Bx: 0.0
              By: 0.0
              Wx: 0.0
              Wy: 0.0
            maxBound:
              Tmax: 10000.0
              Tmin: 10000.0
              Tgamma: 2.6
              Rx: 1.0
              Ry: 1.0
              Gx: 1.0
              Gy: 1.0
              Bx: 1.0
              By: 1.0
              Wx: 1.0
              Wy: 1.0
        supportedValues:
          dvCalibrationValues: []
        pictureModeCapabilities: # DOLBY_VISION only
          - Entertainment: &dolbyVisionOnly
              - DOLBY_VISION:
                  supportedAVSources:
                    - IP
                    - TUNER
                    - HDMI_1
                    - HDMI_2
                    - HDMI_3
          - Dynamic: *dolbyVisionOnly
          - Dynamic2: *dolbyVisionOnly
          - Sports: *dolbyVisionOnly
          - Movie: *dolbyVisionOnly
          - Expert: *dolbyVisionOnly
    - TWO_POINT_WB:
        isSupported: true
        isGlobal: false
        rangeBound:
          twoPointWBBounds: # TwoPointWB bounds
            minBound:
              colourTemperature: WARM
              twoPointWBColour: WB_COLOR_RED
              gain: 0
              offset: -1024
            maxBound:
              colourTemperature: CUSTOM
              twoPointWBColour: WB_COLOR_BLUE
              gain: 2047
              offset: 1023
        supportedValues:
          twoPointWBValues: []
        pictureModeCapabilities: *pqContexts
    - MULTI_POINT_WB:
        isSupported: true
        isGlobal: false
        rangeBound:
          multiPointWBBounds: # WhiteBalanceMultiPointSettings bounds; the number of points is vendor-defined
            minBound:
              colourTemperature: WARM
              r: []
              g: []
              b: []
            maxBound:
              colourTemperature: CUSTOM
              r: []
              g: []
              b: []
        supportedValues:
          multiPointWBValues: []
        pictureModeCapabilities: *pqContexts
    - DYNAMIC_CONTRAST_LEVEL:
        isSupported: true
        isGlobal: true
        rangeBound:
          intBounds: *intBounds0to100
        pictureModeCapabilities: *pqContexts
