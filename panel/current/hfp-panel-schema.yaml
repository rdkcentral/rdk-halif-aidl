# Pykwalify schema for panel/current/hfp-panel.yaml.
#
# Generated by scripts/hfp_schema.py from panel/current/hfp-panel.yaml and the AIDL enums of
# the module. Do not edit: change the HFP or the AIDL, then run
#   scripts/validate_hfp.sh --generate

type: map
mapping:
  panel:
    type: map
    required: true
    mapping:
      interfaceVersion:
        type: str
        required: true
      panelType:
        type: str
        required: true
        desc: AIDL enum com.rdk.hal.panel.PanelType
        enum:
        - LCD
        - QLED
        - OLED
        - MINI_LED
      pixelWidth:
        type: int
        required: true
      pixelHeight:
        type: int
        required: true
      widthCm:
        type: int
        required: true
      heightCm:
        type: int
        required: true
      frameRateMatchingSupported:
        type: bool
        required: true
      fadeDisplaySupported:
        type: bool
        required: true
      supportedPQParameters:
        type: seq
        required: true
        sequence:
        - type: str
      supportedRefreshRatesHz:
        type: seq
        required: true
        sequence:
        - type: int
      pictureModeCapabilities:
        type: seq
        required: true
        sequence:
        - type: map
          mapping:
            regex;(^[A-Za-z0-9_][A-Za-z0-9_ .+-]*$):
              type: seq
              sequence:
              - type: map
                mapping:
                  regex;(^[A-Za-z0-9_][A-Za-z0-9_ .+-]*$):
                    type: map
                    mapping:
                      supportedAVSources:
                        type: seq
                        required: true
                        sequence:
                        - type: str
                          desc: AIDL enum com.rdk.hal.AVSource
                          enum:
                          - AUTO
                          - UNKNOWN
                          - IP
                          - TUNER
                          - SYSTEM
                          - HDMI_1
                          - HDMI_2
                          - HDMI_3
                          - HDMI_4
                          - HDMI_5
                          - COMPOSITE_1
                          - COMPOSITE_2
                          - COMPOSITE_3
                          - COMPOSITE_4
                          - COMPOSITE_5
      colorTemperatureNames:
        type: seq
        required: true
        sequence:
        - type: str
      PQParameterCapabilities:
        type: seq
        required: true
        sequence:
        - type: map
          mapping:
            regex;(^[A-Za-z0-9_][A-Za-z0-9_ .+-]*$):
              type: map
              mapping:
                isGlobal:
                  type: bool
                  required: true
                minValue:
                  type: int
                  required: true
                maxValue:
                  type: int
                  required: true
                pictureModeCapabilities:
                  type: seq
                  required: true
                  sequence:
                  - type: map
                    mapping:
                      regex;(^[A-Za-z0-9_][A-Za-z0-9_ .+-]*$):
                        type: seq
                        sequence:
                        - type: map
                          mapping:
                            regex;(^[A-Za-z0-9_][A-Za-z0-9_ .+-]*$):
                              type: map
                              mapping:
                                supportedAVSources:
                                  type: seq
                                  required: true
                                  sequence:
                                  - type: str
                                    desc: AIDL enum com.rdk.hal.AVSource
                                    enum:
                                    - AUTO
                                    - UNKNOWN
                                    - IP
                                    - TUNER
                                    - SYSTEM
                                    - HDMI_1
                                    - HDMI_2
                                    - HDMI_3
                                    - HDMI_4
                                    - HDMI_5
                                    - COMPOSITE_1
                                    - COMPOSITE_2
                                    - COMPOSITE_3
                                    - COMPOSITE_4
                                    - COMPOSITE_5
