# meta-mw - parent layer for the middleware build configuration.
# The real middleware layer is owned by the MW team; this carries the pattern:
# depend on meta-rdk-halif-aidl, build the HAL, and require the hand-written
# halif-mw.inc from the build (local.conf / distro):
#     require ${TOPDIR}/../rdk-halif-aidl/tests/yocto/meta-mw/conf/halif-mw.inc
#
# Like meta-vendor it builds the HAL; the two configurations differ only by
# mount point, sharing the same rdk-halif-aidl recipe.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb"

BBFILE_COLLECTIONS += "rdk-halif-aidl-mw"
BBFILE_PATTERN_rdk-halif-aidl-mw = "^${LAYERDIR}/"
BBFILE_PRIORITY_rdk-halif-aidl-mw = "7"

LAYERDEPENDS_rdk-halif-aidl-mw = "core rdk-halif-aidl"
LAYERSERIES_COMPAT_rdk-halif-aidl-mw = "kirkstone scarthgap walnascar"
