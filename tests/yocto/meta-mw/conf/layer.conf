# meta-mw - EXAMPLE parent layer for the middleware build configuration.
# The real middleware layer is owned by the MW team; this shows the pattern:
# depend on meta-rdk-halif, build the full HAL at latest, and require
# the hand-written halif-mw.inc from the build (local.conf / distro):
#     require ${TOPDIR}/../rdk-halif-aidl/tests/yocto/meta-mw/conf/halif-mw.inc
#
# Like meta-vendor it builds the full HAL at latest; the two configurations
# differ only by role + destination, sharing the same rdk-halif recipe.

BBPATH .= ":${LAYERDIR}"

BBFILE_COLLECTIONS += "rdk-halif-mw"
BBFILE_PATTERN_rdk-halif-mw = "^${LAYERDIR}/"
BBFILE_PRIORITY_rdk-halif-mw = "7"

LAYERDEPENDS_rdk-halif-mw = "core rdk-halif"
LAYERSERIES_COMPAT_rdk-halif-mw = "kirkstone scarthgap walnascar"
