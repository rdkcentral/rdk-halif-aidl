# meta-mw - EXAMPLE parent layer for the middleware build configuration.
# The real middleware layer is owned by the MW team; this shows the pattern:
# depend on meta-rdk-halif-aidl, build the full HAL at latest, and require
# the hand-written halif-mw.inc from the build (local.conf / distro):
#     require ${TOPDIR}/../rdk-halif-aidl/tests/yocto/meta-mw/conf/halif-mw.inc
#
# Like meta-vendor it builds the full HAL at latest; the two configurations
# differ only by role + destination, sharing the same rdk-halif-aidl recipe.
#
# recipes-example/ holds a worked example of a middleware client consuming the
# HAL - see mw-halif-example.bb.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb"

BBFILE_COLLECTIONS += "rdk-halif-aidl-mw"
BBFILE_PATTERN_rdk-halif-aidl-mw = "^${LAYERDIR}/"
BBFILE_PRIORITY_rdk-halif-aidl-mw = "7"

LAYERDEPENDS_rdk-halif-aidl-mw = "core rdk-halif-aidl"
LAYERSERIES_COMPAT_rdk-halif-aidl-mw = "kirkstone scarthgap walnascar"
