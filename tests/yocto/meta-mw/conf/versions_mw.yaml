# versions_mw.yaml - EXAMPLE HAL cohort for the middleware build configuration.
# Deliberately an OLDER cohort than versions_vendor.yaml (0.1.x vs 0.2.x) to show
# vendor and MW diverging on component versions from the same meta-rdk-halif
# recipes. Must be a consistent closure; gen_team_conf.py enforces this.
#
# Regenerate the include after editing:
#   scripts/gen_team_conf.py tests/yocto/meta-mw/conf/versions_mw.yaml \
#       --role mw -o tests/yocto/meta-mw/conf/halif-mw.inc

components:
  common: 0.1.0.0
  avclock: 0.1.0.0
