# meta-vendor - EXAMPLE parent layer for the vendor build configuration.
# The real vendor layer is owned by the vendor team; this shows the pattern:
# depend on meta-rdk-halif, pick the vendor cohort in versions_vendor.yaml, and
# require the generated halif-vendor.inc from the build (local.conf / distro):
#     require ${TOPDIR}/../rdk-halif-aidl/tests/yocto/meta-vendor/conf/halif-vendor.inc

BBPATH .= ":${LAYERDIR}"

BBFILE_COLLECTIONS += "rdk-halif-vendor"
BBFILE_PATTERN_rdk-halif-vendor = "^${LAYERDIR}/"
BBFILE_PRIORITY_rdk-halif-vendor = "7"

LAYERDEPENDS_rdk-halif-vendor = "core rdk-halif"
LAYERSERIES_COMPAT_rdk-halif-vendor = "kirkstone scarthgap walnascar"
