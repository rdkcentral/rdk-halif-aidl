# meta-vendor - EXAMPLE parent layer for the vendor build configuration.
# The real vendor layer is owned by the vendor team; this shows the pattern:
# depend on meta-rdk-halif-aidl, build the full HAL at latest, and
# require the hand-written halif-vendor.inc from the build (local.conf / distro):
#     require ${TOPDIR}/../rdk-halif-aidl/tests/yocto/meta-vendor/conf/halif-vendor.inc
#
# recipes-example/ holds a worked example of a vendor component consuming the
# HAL - see vendor-halif-example.bb.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb"

BBFILE_COLLECTIONS += "rdk-halif-aidl-vendor"
BBFILE_PATTERN_rdk-halif-aidl-vendor = "^${LAYERDIR}/"
BBFILE_PRIORITY_rdk-halif-aidl-vendor = "7"

LAYERDEPENDS_rdk-halif-aidl-vendor = "core rdk-halif-aidl"
LAYERSERIES_COMPAT_rdk-halif-aidl-vendor = "kirkstone scarthgap walnascar"
