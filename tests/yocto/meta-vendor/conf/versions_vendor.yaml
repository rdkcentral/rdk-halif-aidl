# versions_vendor.yaml - EXAMPLE version pins for the vendor build configuration.
# The rdk-halif recipe consumes this directly (via HALIF_VERSIONS_FILE); a
# component listed here builds the pinned version, anything else builds its
# latest. The selected set must be a consistent closure (a component's linked
# dependencies are pinned at the exact linked version); halif_plan.py enforces
# this at build time.

components:
  common: 0.2.0.0
  avclock: 0.2.0.0
