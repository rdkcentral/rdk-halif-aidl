# meta-rdk-halif-aidl - a consumable Yocto layer for the RDK HAL AIDL interface
# libraries. Add this directory to BBLAYERS; the single rdk-halif-aidl recipe
# builds the components in HALIF_COMPONENTS and splits them into
# rdk-halif-aidl-<component> packages.
#
# The -aidl suffix runs through the layer, recipe, packages and install paths so
# nothing here is confused with the legacy C HAL (rdk-halif-*) it coexists with
# during migration.
#
# The default component list (halif-components.inc) is generated by this layer's
# gen_recipes.py - see docs/standards/build_integration.md.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb"

BBFILE_COLLECTIONS += "rdk-halif-aidl"
BBFILE_PATTERN_rdk-halif-aidl = "^${LAYERDIR}/"
BBFILE_PRIORITY_rdk-halif-aidl = "6"

LAYERDEPENDS_rdk-halif-aidl = "core"
LAYERSERIES_COMPAT_rdk-halif-aidl = "kirkstone scarthgap walnascar"
