# meta-halif-ci - a MINIMAL layer that exists only to let CI run real bitbake on
# the rdk-halif-aidl recipe. It is NOT consumption material and NOT part of the
# product; it provides the one thing plain poky cannot: a linux-binder provider.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb"

BBFILE_COLLECTIONS += "halif-ci"
BBFILE_PATTERN_halif-ci = "^${LAYERDIR}/"
BBFILE_PRIORITY_halif-ci = "10"

LAYERDEPENDS_halif-ci = "core"
LAYERSERIES_COMPAT_halif-ci = "kirkstone scarthgap"
