# meta-rdk-halif - a consumable Yocto layer for the RDK HAL AIDL interface
# libraries. Add this directory to BBLAYERS; the single rdk-halif recipe builds
# the components in HALIF_COMPONENTS and splits them into rdk-halif-<component>
# packages. The default component list (halif-components.inc) is generated by
# scripts/gen_recipes.py - see docs/standards/build_integration.md.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb"

BBFILE_COLLECTIONS += "rdk-halif"
BBFILE_PATTERN_rdk-halif = "^${LAYERDIR}/"
BBFILE_PRIORITY_rdk-halif = "6"

LAYERDEPENDS_rdk-halif = "core"
LAYERSERIES_COMPAT_rdk-halif = "kirkstone scarthgap walnascar"
