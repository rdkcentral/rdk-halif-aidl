# Pykwalify schema for deviceinfo/current/hfp-deviceinfo.yaml.
#
# Generated by scripts/hfp_schema.py from deviceinfo/current/hfp-deviceinfo.yaml and the AIDL enums of
# the module. Do not edit: change the HFP or the AIDL, then run
#   scripts/validate_hfp.sh --generate

type: map
mapping:
  deviceinfo:
    type: map
    required: true
    mapping:
      interfaceVersion:
        type: str
        required: true
      properties:
        type: seq
        required: true
        sequence:
        - type: map
          mapping:
            name:
              type: str
              required: true
            value:
              type: str
              required: true
            format:
              type: str
              required: true
              desc: AIDL enum com.rdk.hal.deviceinfo.PropertyType
              enum:
              - STRING
              - MAC
              - NUMERIC
              - ISO3166
              - ISO639
              - UPPERCASEHEX
              - SEMANTICVERSION
            max_size:
              type: int
              required: true
            zero_terminated:
              type: bool
              required: true
