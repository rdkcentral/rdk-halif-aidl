videocapture:                        # Component object begins
  interfaceVersion: current
  captures:                     # Resource list - one object per capture this product offers
    - 0:                        # Resource object begins
        supportedSources:       # Kinds of pipeline stage this capture can bind to
                                # (enum Source). Declare what this product can do.
                                # A session binds to one named resource of one of
                                # these kinds - VIDEO_SINK through openWithSink(),
                                # VIDEO_DECODER through openWithDecoder(). The
                                # source resource declares its own side too:
                                # videosink Capabilities.supportsCapture, and
                                # videodecoder OperationalMode.GRAPHICS_TEXTURE.
          - VIDEO_SINK
          - VIDEO_DECODER
        maxCapturesPerSource: 1 # How many sessions one source resource can carry at once.
                                # A further bind is refused with SOURCE_UNAVAILABLE.
        captureCapabilities:    # Frames and buffer pool for IVideoCapture on this resource.
                                # This is the whole of the capture declaration - the
                                # vendor layer configures whatever the bound source
                                # needs to deliver what is declared here.
          stallsWhenPoolExhausted: false  # true: source stalls when all buffers locked
                                          # false: oldest ready frame is dropped
          # FOURCC codes and modifiers are the kernel's, from include/uapi/drm/drm_fourcc.h.
          # Declared in pairs: a modifier is valid with particular formats.
          supportedFormats:     # The pairs this product can deliver, and the whole of them
            - fourcc: 0x3231564E              # DRM_FORMAT_NV12
              modifier: 0x0000000000000000    # DRM_FORMAT_MOD_LINEAR
          maxFrameWidth: 1920   # Maximum captured frame width (Property.WIDTH)
          maxFrameHeight: 1080  # Maximum captured frame height (Property.HEIGHT)
          supportedCodecs:      # Codecs whose decoded frames this capture can take.
                                # Declare what this product can do. A decoder opened
                                # for a codec not listed here decodes and displays
                                # normally; it just cannot feed this capture.
            - H264_AVC
            - AV1
          resize: false         # false: captured resolution must equal the source
                                # resolution; a mismatch fails start() with
                                # RESOLUTION_MISMATCH and nothing is scaled.
