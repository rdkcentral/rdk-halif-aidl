# component   - Machine-readable component identifier                    [manual]
# version     - Pre-baseline: 0.<generation>.<minor>.<patch>              [release.sh]
# status      - RAG status: GREEN / AMBER / RED                          [manual]
# description - One-line human-readable summary                          [manual]
# type        - Responsibility: SOC or OEM                                [manual]
component: videocapture
version: 0.1.0.0
status: AMBER
description: "Decoded video frame capture bound to a named pipeline source"
type: SOC

# lifecycle - 14+5 review cycle dates                                    [pr_cycle.sh]
#   review_started    - Date the review window opened
#   review_deadline   - review_started + 14 calendar days
#   target_green_date - review_deadline + 5 business days
lifecycle:
  review_started: ~
  review_deadline: ~
  target_green_date: ~

# scope - High-level architectural responsibilities                       [manual]
scope:
  - Video frame capture as an output in its own right, bound to a named video sink
  - Frames delivered as the bound sink would present them, the sink keeping the timing policy
  - Capture session lifecycle, ring shape configuration and frame acquire/release
  - Decoded video frame capture to a Dma-Buf ring for decode-to-texture
  - Symmetric per-product declaration of which sources a platform can capture from

# notes - Tracking metadata                                              [manual]
#   priority      - Numeric priority (lower = higher)
#   status_detail - Short current state description
#   action        - Required action to progress
#   risk          - Risk notes (appears as watch item on dashboard)
#   owners        - Responsible architecture teams
notes:
  priority: 3
  status_detail: "Standalone videocapture module for #753; binds one named video sink, with the sink declaring supportsCapture and owning the timing policy"
  action: "Add an explicit free-run (immediate) presentation mode to videosink, which capture then inherits through HAL.VIDEOCAPTURE.10"
  owners: "Architecture + Graphics_Architecture"

# reviewers - Sign-off status per stakeholder team                       [manual]
#   Values: pending | in_review | changes_requested | recheck | reviewed | abstained
reviewers:
    Architecture: pending
    Product_Architecture: pending
    AV_Architecture: pending
    Graphics_Architecture: pending
    Vendor_Layer_Team: pending
