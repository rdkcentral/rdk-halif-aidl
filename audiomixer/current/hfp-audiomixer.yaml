# HAL Feature Profile

audiomixer:
  interfaceVersion: current

  # List of mixer resources available on this platform.
  # Each resources entry describes a single logical audio mixer instance and its input capabilities
  resources:
    - id: 0  # Mixer instance 0 (secure)
      supportsSecure: true
      # Mixer-level properties supported on this instance
      supportedProperties:
        - LATENCY_MS
        - MUTE
        - FADER_LEVEL
      # Supported audio source types for dynamic input routing
      supportedSourceTypes:
        - AUDIO_SINK
        - HDMI_INPUT
        - COMPOSITE_INPUT
        - APPLICATION_AUDIO
      inputs:
        - name: main
          supportedContentTypes:
            - STREAM
          supportedCodecs:
            - DOLBY_AC3
            - DOLBY_AC3_PLUS
            - PCM
            - AAC_LC
        - name: assoc
          supportedContentTypes:
            - STREAM
          supportedCodecs:
            - DOLBY_AC3
            - DOLBY_AC3_PLUS
            - PCM
            - AAC_LC
        - name: pcm1
          supportedContentTypes:
            - STREAM
            - CLIP
            - TTS
          supportedCodecs:
            - PCM
        - name: pcm2
          supportedContentTypes:
            - STREAM
            - CLIP
            - TTS
          supportedCodecs:
            - PCM

    - id: 1  # Mixer instance 1 (non-secure)
      supportsSecure: false
      inputs:
        - name: main
          supportedContentTypes:
            - STREAM
          supportedCodecs:
            - PCM
            - AAC_LC
        - name: aux
          supportedContentTypes:
            - CLIP
            - TTS
          supportedCodecs:
            - PCM

  # List of output ports and their capabilities.
  # These define what each physical/logical output supports (e.g., HDMI, SPDIF).
  #
  # portName: free-form string. The canonical spellings are reserved —
  #   platforms MUST use them when one applies (matches
  #   OutputPortCapabilities.portName): HDMI, HDMI_ARC, HDMI_EARC, SPDIF,
  #   SPEAKERS, HEADPHONE, LINE_OUT, BLUETOOTH, USB_AUDIO.
  # portType: programmatic OutputPortType enum (HDMI, SPDIF, INTERNAL, ...).
  # isAQRouted: true when this port routes through the AQ processing block.
  #             When true, the port surfaces an IAQProcessor via
  #             IAudioOutputPort.getAQProcessor(). The processor's identity
  #             (family + version) is declared in the aqProcessors section
  #             below; clients use IAQProcessor.getProcessorType() /
  #             getVersion() at runtime to branch.
  outputPorts:
    - id: 0
      portName: HDMI
      portType: HDMI
      isAQRouted: true
      aqProcessorId: 0       # references aqProcessors[].id below
      supportedProperties:
        - VOLUME
        - DELAY_MS
        - OUTPUT_FORMAT
        - CONNECTION_STATE
      supportedOutputFormats:
        - AUTO
        - PCM_STEREO
        - AC3
        - EAC3
      supportsAudioCapture: false

    - id: 1
      portName: SPDIF
      portType: SPDIF
      isAQRouted: true
      aqProcessorId: 1       # older MS12 instance — see aqProcessors below
      supportedProperties:
        - VOLUME
        - OUTPUT_FORMAT
      supportedOutputFormats:
        - PCM_STEREO
        - AC3
      supportsAudioCapture: false

    - id: 2
      portName: PCM_CAPTURE
      portType: INTERNAL
      isAQRouted: false
      supportedProperties:
        - OUTPUT_FORMAT
      supportedOutputFormats:
        - PCM_STEREO
        - PCM_MULTICHANNEL
      supportsAudioCapture: true

      # Supported channel configurations for audio capture
      supportedChannelLayouts:
        # Stereo: Front Left, Front Right
        - format: PCM_STEREO
          channels: [CH_FL, CH_FR]

        # 5.1 Surround: Front Left, Front Right, Front Centre, LFE, Rear Left, Rear Right
        - format: PCM_MULTICHANNEL
          channels: [CH_FL, CH_FR, CH_FC, CH_LFE, CH_RL, CH_RR]
          description: "5.1 surround configuration"

        # 7.1 Surround: Front Left, Front Right, Front Centre, LFE, Side Left, Side Right, Rear Left, Rear Right
        - format: PCM_MULTICHANNEL
          channels: [CH_FL, CH_FR, CH_FC, CH_LFE, CH_SL, CH_SR, CH_RL, CH_RR]
          description: "7.1 surround configuration"

        # 5.1.2 Atmos: 5.1 + Top Front Left, Top Front Right
        - format: PCM_MULTICHANNEL
          channels: [CH_FL, CH_FR, CH_FC, CH_LFE, CH_RL, CH_RR, CH_TFL, CH_TFR]
          description: "5.1.2 Atmos configuration"

        # 5.1.4 Atmos: 5.1 + Top Front Left, Top Front Right, Top Rear Left, Top Rear Right
        - format: PCM_MULTICHANNEL
          channels: [CH_FL, CH_FR, CH_FC, CH_LFE, CH_RL, CH_RR, CH_TFL, CH_TFR, CH_TRL, CH_TRR]
          description: "5.1.4 Atmos configuration"

      # Supported channel definitions for AudioCapturePcmInfo.channelMap
      supportedChannels:
        - CH_FL   # Front Left
        - CH_FR   # Front Right
        - CH_FC   # Front Centre
        - CH_LFE  # Low-Frequency Effects (Subwoofer)
        - CH_SL   # Side Left
        - CH_SR   # Side Right
        - CH_RL   # Rear Left
        - CH_RR   # Rear Right
        - CH_RC   # Rear Centre
        - CH_TFL  # Top Front Left
        - CH_TFR  # Top Front Right
        - CH_TFC  # Top Front Centre
        - CH_TSL  # Top Side Left
        - CH_TSR  # Top Side Right
        - CH_TRL  # Top Rear Left
        - CH_TRR  # Top Rear Right
        - CH_WL   # Wide Left
        - CH_WR   # Wide Right

  # AQ (Audio Quality) processor instances available on this platform.
  #
  # Each entry describes one processor instance — surfaced at runtime by
  # IAudioOutputPort.getAQProcessor() on every output port whose
  # aqProcessorId matches the entry's id. The vendor HAL populates
  # IAQProcessor.getSupportedParameters() from the parameters[] list below
  # and validates IAQProcessorController.setAQParameter() / setAQParameters()
  # against each parameter's declared type, min, and max.
  #
  # Multiple instances of the same processor family (here, two MS12
  # versions) may co-exist on the same platform — clients use
  # IAQProcessor.getProcessorType() to identify the family and
  # IAQProcessor.getVersion() to distinguish instances.
  #
  # parameter fields:
  #   name            - Canonical parameter name (matches AQParameter.aidl
  #                     spellings when one applies; new vendor-specific
  #                     names are allowed without an AIDL change).
  #   type            - One of: BOOLEAN, INTEGER, LONG, FLOAT, DOUBLE, STRING.
  #                     Identifies which PropertyValue union field carries
  #                     the value.
  #   readOnly        - true if the parameter cannot be written.
  #   unit            - Optional UI/logging label ("dB", "ms", ...).
  #   min, max        - Inclusive range used for validation.
  #   offValue        - Optional platform-specific OFF sentinel
  #                     (distinct from defaultValue).
  #   onValue         - Optional platform-specific ON sentinel.
  #   defaultValue    - Factory-reset value applied by
  #                     IAQProcessorController.resetToDefault().
  #   isGlobal        - true when writing this parameter on any port
  #                     applies it across every port whose processor
  #                     exposes the same parameter name.
  #   includedInSoundMode - List of sound-mode names that touch this
  #                         parameter when activated via
  #                         setAQSoundMode().
  #   description     - Human-readable label for diagnostics / UI.
  aqProcessors:
    - id: 0
      type: DOLBY_MS12_2_6
      version: "2.6.1"
      name: "Dolby MS12-X v2.6.1"
      soundModes:
        - MOVIE
        - MUSIC
        - NEWS
        - SPORTS
      parameters:
        - name: BASS_ENHANCER_GAIN
          type: INTEGER
          readOnly: false
          unit: "dB"
          min: 0
          max: 24
          offValue: -1
          defaultValue: 0
          isGlobal: false
          includedInSoundMode: [MOVIE, MUSIC]
          description: "Low-frequency enhancement gain."
        - name: DIALOGUE_ENHANCER
          type: BOOLEAN
          readOnly: false
          defaultValue: false
          isGlobal: false
          includedInSoundMode: [MOVIE, NEWS]
          description: "Dialogue clarity enhancement."
        - name: VOLUME_LEVELLER
          type: INTEGER
          readOnly: false
          min: 0
          max: 10
          offValue: 0
          defaultValue: 5
          isGlobal: true
          includedInSoundMode: [MOVIE, MUSIC, NEWS, SPORTS]
          description: "Automatic volume levelling intensity."
        - name: POST_GAIN
          type: FLOAT
          readOnly: false
          unit: "dB"
          min: -20.8
          max: 4.8
          defaultValue: 0.0
          isGlobal: false
          includedInSoundMode: []
          description: "Final output gain adjustment."
        - name: ATMOS_LOCK
          type: BOOLEAN
          readOnly: false
          defaultValue: false
          isGlobal: false
          includedInSoundMode: [MOVIE]
          description: "Lock output to Dolby Atmos rendering."
        - name: DRC_MODE
          type: STRING
          readOnly: false
          defaultValue: "LINE"
          isGlobal: false
          includedInSoundMode: [MOVIE]
          description: "Dynamic Range Control mode (LINE or RF)."

    # 'type' names the processor FAMILY / DAP command-set generation (the "2_6"
    # is the MS12 DAP command set, not a comparable version); 'version' is the
    # vendor implementation version. Clients branch on getProcessorType()
    # (family) then getVersion() (impl) — two separate axes.
    - id: 1
      type: DOLBY_MS12_2_6
      version: "1.4.3"
      name: "Dolby MS12 v1.4.3"
      soundModes:
        - MOVIE
        - MUSIC
      # Older instance — smaller parameter set than v2.6.1.
      parameters:
        - name: VOLUME_LEVELLER
          type: INTEGER
          readOnly: false
          min: 0
          max: 10
          offValue: 0
          defaultValue: 5
          isGlobal: true
          includedInSoundMode: [MOVIE, MUSIC]
          description: "Automatic volume levelling intensity (legacy range)."
        - name: DIALOGUE_ENHANCER
          type: BOOLEAN
          readOnly: false
          defaultValue: false
          isGlobal: false
          includedInSoundMode: [MOVIE]
          description: "Dialogue clarity enhancement."
        - name: POST_GAIN
          type: FLOAT
          readOnly: false
          unit: "dB"
          min: -12.0
          max: 4.0
          defaultValue: 0.0
          isGlobal: false
          includedInSoundMode: []
          description: "Final output gain adjustment."
