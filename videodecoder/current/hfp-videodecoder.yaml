# HAL Feature Profile for videodecoder
#
# Mirrors codecCapabilities/profile capabilities field-for-field.
# Reference implementation aligned with
# rdk-hpk-documentation/hfp-reference/videodecoder/hfp-videodecoder.yaml.
#
# Per-codec capability semantics:
#   - `profiles[]` enumerates exactly which profiles are supported for the
#     codec — no implicit "lower profiles also supported" rule.
#   - Within each profile, `maxLevel` is inclusive — all lower levels for
#     the same profile are implicitly supported.
#   - `maxBitrateInBps` is an inclusive ceiling for the profile/level.
#     Use `0` only if the SoC vendor doesn't publish a real cap.

videodecoder: # Component object begins
  interfaceVersion: current
  supportedOperationalModes:
    - NON_TUNNELLED
  Capabilities: # Resource list
    - 0: # Resource object begins (high-tier decoder)
      codecCapabilities:
        - MPEG2_VIDEO:
            profiles:
              - MPEG2_SIMPLE:
                  maxLevel: MPEG2_LEVEL_HIGH
                  maxBitrateInBps: 50000000
              - MPEG2_MAIN:
                  maxLevel: MPEG2_LEVEL_HIGH
                  maxBitrateInBps: 50000000
            dynamicRange:
              - SDR
            maxFrameRate: 60
            maxFrameWidth: 1920
            maxFrameHeight: 1080
            supportedOutputPixelFormats:
              - YCBCR420
        - H264_AVC:
            profiles:
              - H264_BASELINE:
                  maxLevel: H264_LEVEL_5_2
                  maxBitrateInBps: 50000000
              - H264_MAIN:
                  maxLevel: H264_LEVEL_5_2
                  maxBitrateInBps: 50000000
              - H264_HIGH:
                  maxLevel: H264_LEVEL_5_2
                  maxBitrateInBps: 50000000
            dynamicRange:
              - SDR
              - HLG
              - HDR10
              - HDR10_PLUS
              - DOLBY_VISION
            maxFrameRate: 60
            maxFrameWidth: 1920
            maxFrameHeight: 1080
            supportedOutputPixelFormats:
              - YCBCR420
        - H265_HEVC:
            profiles:
              - H265_MAIN:
                  maxLevel: H265_LEVEL_6_2
                  maxBitrateInBps: 150000000
              - H265_MAIN_10:
                  maxLevel: H265_LEVEL_6_2
                  maxBitrateInBps: 150000000
              - H265_MAIN_10_HDR10:
                  maxLevel: H265_LEVEL_6_2
                  maxBitrateInBps: 150000000
            dynamicRange:
              - SDR
              - HLG
              - HDR10
              - HDR10_PLUS
              - DOLBY_VISION
            maxFrameRate: 60
            maxFrameWidth: 3840
            maxFrameHeight: 2160
            supportedOutputPixelFormats:
              - YCBCR420
        - VP9:
            profiles:
              - VP9_PROFILE_0:
                  maxLevel: VP9_LEVEL_6_2
                  maxBitrateInBps: 50000000
              - VP9_PROFILE_1:
                  maxLevel: VP9_LEVEL_6_2
                  maxBitrateInBps: 50000000
              - VP9_PROFILE_2:
                  maxLevel: VP9_LEVEL_6_2
                  maxBitrateInBps: 50000000
              - VP9_PROFILE_3:
                  maxLevel: VP9_LEVEL_6_2
                  maxBitrateInBps: 50000000
            dynamicRange:
              - SDR
              - HLG
              - HDR10
              - HDR10_PLUS
            maxFrameRate: 60
            maxFrameWidth: 3840
            maxFrameHeight: 2160
            supportedOutputPixelFormats:
              - YCBCR420
        - AV1:
            profiles:
              - AV1_MAIN:
                  maxLevel: AV1_LEVEL_6_2
                  maxBitrateInBps: 50000000
              - AV1_HIGH:
                  maxLevel: AV1_LEVEL_6_2
                  maxBitrateInBps: 50000000
            dynamicRange:
              - SDR
              - HLG
              - HDR10
              - HDR10_PLUS
              - DOLBY_VISION
            maxFrameRate: 60
            maxFrameWidth: 3840
            maxFrameHeight: 2160
            supportedOutputPixelFormats:
              - YCBCR420
      supportedColorimetries:
        - BT601_525
        - BT601_625
        - BT709
        - BT2020
      supportsSecure: true
    - 1: # Resource object begins (secondary HD decoder)
