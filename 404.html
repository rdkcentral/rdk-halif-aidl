<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Page not found</title>
<script>
// A path with no version opens the same page in the default version.
(function () {
  var prefix = "/rdk-halif-aidl/", fallback = "0.23.0", versions = ["0.10.0", "0.11.0", "0.12.0", "0.13.0", "0.15.0", "0.21.0", "0.23.0", "0.8.1"];
  var path = window.location.pathname;
  if (path.indexOf(prefix) !== 0) { return; }
  var rest = path.slice(prefix.length);
  if (rest === "" || versions.indexOf(rest.split("/")[0]) !== -1) { return; }
  window.location.replace(prefix + fallback + "/" + rest + window.location.search + window.location.hash);
})();
</script>
</head>
<body>
<p>Page not found. <a href="/rdk-halif-aidl/">Open the documentation home page.</a></p>
</body>
</html>
