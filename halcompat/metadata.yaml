# component   - Machine-readable component identifier                    [manual]
# version     - Pre-baseline: 0.<generation>.<minor>.<patch>              [release.sh]
# status      - RAG status: GREEN / AMBER / RED                          [manual]
# description - One-line human-readable summary                          [manual]
# type        - Responsibility: SOC or OEM; CLIENT for a middleware-side
#               helper with no vendor implementation                      [manual]
component: halcompat
version: 0.1.0.0
status: GREEN
description: "Client-side C++ compatibility helpers: service lookup, isCompatible() and atLeast() feature gates (header-only, no AIDL)"
type: CLIENT

# lifecycle - 14+5 review cycle dates                                    [pr_cycle.sh]
#   review_started    - Date the review window opened
#   review_deadline   - review_started + 14 calendar days
#   target_green_date - review_deadline + 5 business days
lifecycle:
  review_started: ~
  review_deadline: ~
  target_green_date: ~

# scope - High-level architectural responsibilities                       [manual]
scope:
  - Service lookup by a generated interface's serviceName()
  - Compatibility predicate over getInterfaceVersion() and getInterfaceHash(), with the era rules internal to the helper
  - Feature gates on additive releases via atLeast(era, major, minor, bugfix)
  - Rejection of unfrozen development servers unless the client opts in

# notes - Tracking metadata                                              [manual]
#   priority      - Numeric priority (lower = higher)
#   status_detail - Short current state description
#   action        - Required action to progress
#   risk          - Risk notes (appears as watch item on dashboard)
#   owners        - Responsible architecture teams
notes:
  priority: 3
  status_detail: "Header-only; ships as halcompat/<version>/include/halcompat.h with no library to link"
  owners: "Architecture"

# reviewers - Sign-off status per stakeholder team                       [manual]
#   Values: pending | in_review | changes_requested | recheck | reviewed | abstained
reviewers:
    Architecture: reviewed
    Product_Architecture: abstained
    AV_Architecture: abstained
    Vendor_Layer_Team: abstained
