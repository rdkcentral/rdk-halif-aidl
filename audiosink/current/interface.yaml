aidl_interface:
  name: audiosink
  srcs:
    - com/rdk/hal/audiosink/*.aidl
  imports:
    - audiodecoder@current
    - avclock@current
    - common@current
    - metrics@current
  stability: vintf
  layout: module-local

# The vocabulary scripts/kvcc.py generates this interface's metric enums from.
# A new key there is a new member here, so it is an additive interface change.
kvc:
  vocabulary: audiosink
  minimum: "1.0"
