# Pykwalify schema for audiosink/current/hfp-audiosink.yaml.
#
# Generated by scripts/hfp_schema.py from audiosink/current/hfp-audiosink.yaml and the AIDL enums of
# the module. Do not edit: change the HFP or the AIDL, then run
#   scripts/validate_hfp.sh --generate

type: map
mapping:
  audiosink:
    type: map
    required: true
    mapping:
      interfaceVersion:
        type: str
        required: true
      IAudioSink:
        type: seq
        required: true
        sequence:
        - type: map
          mapping:
            id:
              type: int
              required: true
            supportsSecure:
              type: bool
              required: true
            supportedContentTypes:
              type: seq
              required: true
              sequence:
              - type: str
                desc: AIDL enum com.rdk.hal.audiosink.ContentType
                enum:
                - UNKNOWN
                - SPEECH
                - MUSIC
                - MOVIE
                - SONIFICATION
      platformCapabilities:
        type: map
        required: true
        mapping:
          supportsLowLatency:
            type: bool
            required: true
          supportedSampleRatesHz:
            type: seq
            required: true
            sequence:
            - type: int
          supportedPCMFormats:
            type: seq
            required: true
            sequence:
            - type: str
          supportsPlanarFormat:
            type: bool
            required: true
          supportsSoCProprietary:
            type: bool
            required: true
          maxNumChannels:
            type: int
            required: true
          supportsDolbyAtmos:
            type: bool
            required: true
