# HAL Feature Profile (HFP): audiosink
#
# Product:   RDK-E reference defaults (not a shipping product)
# Platform:  RDK
# Supplier:  SoC vendor (expected; confirmed per product)
# Source:    [develop: audiosink/current](https://github.com/rdkcentral/rdk-halif-aidl/blob/develop/audiosink/current/hfp-audiosink.yaml)
#
# RDK reference HFP: the defaults each product HFP set is derived from.
# Lifecycle: [Product HFP Lifecycle](https://github.com/rdkcentral/rdk-halif-aidl/blob/develop/docs/key_concepts/hal/hal_feature_profiles.md#product-hfp-lifecycle)

audiosink:
  interfaceVersion: current

  IAudioSink:
    - id: 0
      supportsSecure: true
      supportedContentTypes:
        - UNKNOWN
        - SPEECH
        - MUSIC
        - MOVIE
        - SONIFICATION
    - id: 1
      supportsSecure: false
      supportedContentTypes:
        - SPEECH
        - MUSIC

  platformCapabilities:
    supportsLowLatency: false
    supportedSampleRatesHz:
      - 48000
    supportedPCMFormats:
      - S16LE
    supportsPlanarFormat: false
    supportsSoCProprietary: false
    maxNumChannels: 2
    supportsDolbyAtmos: false
