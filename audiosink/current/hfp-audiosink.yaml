# HAL Feature Profile for audiosink
audiosink:
  interfaceVersion: current

  # Metrics this product serves through IAudioSink.getMetrics(), for
  # every resource instance. Names are members of the Metric enum.
  supportedMetrics:
    - FRAMES_RENDERED
    - FRAMES_DROPPED
    - GAP_EPISODES
    - GAP_FRAMES
    - GAP_DURATION_NS
    - UNDERFLOW_EPISODES
    - UNDERFLOW_DURATION_NS
    - RENDER_LATENCY_NS
    - QUEUE_DEPTH_NS

  IAudioSink:
    - id: 0
      supportsSecure: true
      supportedContentTypes:
        - UNKNOWN
        - SPEECH
        - MUSIC
        - MOVIE
        - SONIFICATION
    - id: 1
      supportsSecure: false
      supportedContentTypes:
        - SPEECH
        - MUSIC

  platformCapabilities:
    supportsLowLatency: false
    supportedSampleRatesHz:
      - 48000
    supportedPCMFormats:
      - S16LE
    supportsPlanarFormat: false
    supportsSoCProprietary: false
    maxNumChannels: 2
    supportsDolbyAtmos: false
