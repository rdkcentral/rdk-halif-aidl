# versions_released.yaml - released-cohort build manifest.
#
# Pins every component to its latest released snapshot. Used by VTS
# release builds and any consumer that wants a reproducible, cohort-
# locked SDK build. Devs working on the in-development tree use the
# `versions_current.yaml` companion manifest:
#
#     ./build_modules.sh manifest                                   # this file (default)
#     ./build_modules.sh manifest --file versions_current.yaml      # dev cohort
#
# Only components listed in the `components:` map are built; a component
# without a released snapshot is not listed.

components:
  audiodecoder: 0.3.1.0
  audiomixer: 0.4.1.0
  audiosink: 0.3.0.1
  avbuffer: 0.2.1.0
  avclock: 0.3.0.0
  common: 0.3.0.0
  compositeinput: 0.3.0.0
  deepsleep: 0.1.1.0
  deviceinfo: 0.2.0.0
  drm: 0.2.0.0
  firmwareupdate: 0.2.0.1
  hdmicec: 0.2.0.0
  hdmiinput: 0.2.0.0
  hdmioutput: 0.2.1.0
  indicator: 0.2.0.0
  panel: 0.2.0.1
  planecontrol: 0.3.0.0
  sensor: 0.3.0.0
  videodecoder: 0.3.1.0
  videosink: 0.3.0.0
  bootreason: 0.2.0.0
  broadcast: 0.1.0.0
  ringbuffer: 0.1.0.0
